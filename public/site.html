<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra Site</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.hero{min-height:92svh;position:relative;display:flex;align-items:end;padding:6vw;overflow:hidden}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,#000c)}.hero div{position:relative;z-index:2;max-width:900px}.hero h1{font-size:clamp(52px,9vw,120px);line-height:.88;letter-spacing:-.07em;margin:10px 0}.hero p{max-width:650px;line-height:1.6}.sec{padding:8vw 6vw;border-top:1px solid #80808033}.sec h2{font-size:clamp(38px,6vw,78px);line-height:.95;letter-spacing:-.055em;max-width:950px}.sec>p{max-width:700px;line-height:1.7;opacity:.75}.sec img{width:100%;max-height:80svh;object-fit:cover;border-radius:24px;margin:30px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid #80808044;padding:22px;border-radius:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main id="site"></main><script>const e=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));fetch('/api/public/'+location.pathname.split('/').pop()).then(r=>r.json()).then(({spec:s})=>{document.title=s.title;let p=s.palette;document.body.style.background=p.background;document.body.style.color=p.text;document.querySelector('#site').innerHTML=s.sections.map(x=>{let im=x.imageUrl?`<img src="${e(x.imageUrl)}">`:'',items=(x.items||[]).map(i=>`<div class="card"><b>${e(i.title)}</b><p>${e(i.body)}</p><small>${e(i.meta)}</small></div>`).join('');return x.type==='hero'?`<section class="hero" style="background:${p.surface}">${im}<div><small>${e(x.eyebrow)}</small><h1>${e(x.title)}</h1><p>${e(x.body)}</p><b>${e(x.cta)}</b></div></section>`:`<section class="sec"><small>${e(x.eyebrow)}</small><h2>${e(x.title)}</h2><p>${e(x.body)}</p>${im}${items?`<div class="grid">${items}</div>`:''}</section>`}).join('')}).catch(()=>document.querySelector('#site').textContent='Site not found')</script></body></html>
